<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DnD-coding</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0b0d10;color:#e5e7eb;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  a.link-btn{display:inline-flex;align-items:center;gap:8px;background:#1b1f26;border:1px solid #2a2f38;border-radius:8px;padding:10px 16px;color:#e5e7eb;text-decoration:none;font-size:14px;transition:background .12s,border-color .12s;}
  a.link-btn:hover{background:#232937;border-color:#374050;}
</style>
</head>
<body>
  <a class="link-btn" href="gladius-frontier/">⚔ Gladius Frontier →</a>
</body>
</html>
