<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homebrew Arsenal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    :root {
      --bg:#0d1117; --bg-surface:#161b24; --bg-elevated:#1c2333;
      --border:#2a3244; --border-dim:#1c2333;
      --text:#e2e8f0; --text-muted:#64748b; --text-dim:#3a4558;
      --gold:#c9a84c; --gold-bg:rgba(201,168,76,.12); --gold-border:rgba(201,168,76,.3);
      --r-sm:4px; --r-md:8px; --r-lg:12px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(201,168,76,.04) 0%,transparent 70%);pointer-events:none;z-index:0;}

    /* ── Page ── */
    .page{position:relative;max-width:1200px;margin:0 auto;padding:32px 20px 64px;z-index:1;}

    /* ── Header ── */
    .site-header{text-align:center;margin-bottom:36px;}
    .site-header .eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;opacity:.8;}
    .site-header h1{font-size:32px;font-weight:700;letter-spacing:-.5px;color:var(--text);}
    .site-header .sub{font-size:14px;color:var(--text-muted);margin-top:6px;}
    .header-divider{width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto 0;}

    /* ── Controls ── */
    .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:24px;}
    .search-wrap{flex:1;min-width:180px;position:relative;}
    .search-wrap .ti{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:15px;pointer-events:none;}
    .search-input{width:100%;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 10px 8px 32px;font-size:13px;color:var(--text);font-family:inherit;transition:border-color .15s;}
    .search-input:focus{outline:none;border-color:var(--gold);}
    .search-input::placeholder{color:var(--text-dim);}
    .count{font-size:13px;color:var(--text-muted);white-space:nowrap;}

    /* ── Tags filter ── */
    .tag-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px;}
    .tag-btn{font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:var(--bg-surface);color:var(--text-muted);cursor:pointer;transition:all .12s;font-family:inherit;text-transform:uppercase;letter-spacing:.5px;}
    .tag-btn:hover{border-color:var(--gold-border);color:var(--gold);}
    .tag-btn.active{background:var(--gold-bg);border-color:var(--gold-border);color:var(--gold);}

    /* ── Grid ── */
    .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px;}

    /* ── Card thumbnail ── */
    .card-item{cursor:pointer;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border);background:var(--bg-surface);transition:transform .18s,border-color .18s,box-shadow .18s;display:flex;flex-direction:column;}
    .card-item:hover{transform:translateY(-4px);border-color:var(--gold-border);box-shadow:0 8px 32px rgba(201,168,76,.12);}
    .card-img-wrap{aspect-ratio:.48/1;overflow:hidden;background:var(--bg-elevated);position:relative;}
    .card-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .3s;}
    .card-item:hover .card-img-wrap img{transform:scale(1.03);}
    .card-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;}
    .card-placeholder .ph-icon{font-size:36px;opacity:.15;}
    .card-placeholder .ph-name{font-size:13px;font-weight:600;color:var(--text-muted);line-height:1.3;}
    .card-info{padding:10px 12px 12px;}
    .card-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:5px;}
    .card-sub{font-size:11px;color:var(--text-muted);margin-bottom:7px;font-style:italic;}
    .card-tags{display:flex;gap:4px;flex-wrap:wrap;}
    .tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;}
    .tag.gold{background:var(--gold-bg);border-color:var(--gold-border);color:var(--gold);}

    /* ── Empty state ── */
    .empty{text-align:center;padding:80px 20px;color:var(--text-muted);display:none;}
    .empty.show{display:block;}
    .empty-icon{font-size:48px;opacity:.12;display:block;margin-bottom:14px;}
    .empty p{font-size:15px;margin-bottom:5px;}
    .empty small{font-size:13px;opacity:.5;}

    /* ── Lightbox ── */
    .lb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:900;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
    .lb-overlay.open{opacity:1;pointer-events:auto;}
    .lb-inner{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:20px;}
    .lb-img-wrap{max-height:92vh;max-width:90vw;overflow:auto;border-radius:var(--r-lg);box-shadow:0 24px 80px rgba(0,0,0,.8);line-height:0;}
    .lb-img-wrap img{max-width:100%;max-height:92vh;width:auto;height:auto;display:block;border-radius:var(--r-lg);}
    .lb-close{position:fixed;top:16px;right:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;z-index:910;}
    .lb-close:hover{background:rgba(255,255,255,.18);}
    .lb-nav{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;width:44px;height:64px;border-radius:var(--r-md);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;z-index:910;}
    .lb-nav:hover{background:rgba(255,255,255,.18);}
    .lb-prev{left:12px;}
    .lb-next{right:12px;}
    .lb-caption{position:fixed;bottom:0;left:0;right:0;padding:14px 20px;background:linear-gradient(transparent,rgba(0,0,0,.85));text-align:center;z-index:910;}
    .lb-cap-name{font-size:16px;font-weight:600;color:#fff;margin-bottom:3px;}
    .lb-cap-type{font-size:12px;color:rgba(255,255,255,.55);}

    /* ── Toast ── */
    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--bg-elevated);border:1px solid var(--border);border-radius:20px;padding:8px 18px;font-size:13px;color:var(--text);z-index:999;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.4);animation:tin .2s ease,tout .3s ease 2s forwards;}
    @keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
    @keyframes tout{to{opacity:0;transform:translateX(-50%) translateY(8px);}}

    @media(max-width:600px){
      .site-header h1{font-size:24px;}
      .card-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
      .lb-nav{display:none;}
    }
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
  </style>
</head>
<body>
<div class="page">

  <header class="site-header">
    <div class="eyebrow">DM Homebrew</div>
    <h1>⚔️ Homebrew Arsenal</h1>
    <div class="sub">Seiros Academy &amp; Custom Weapons — Browse &amp; share with your party</div>
    <div class="header-divider"></div>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input class="search-input" id="search" type="search" placeholder="Search weapons…" oninput="filterCards()">
    </div>
    <span class="count" id="count"></span>
  </div>

  <div class="tag-filters" id="tag-filters"></div>

  <div class="card-grid" id="card-grid"></div>
  <div class="empty" id="empty">
    <i class="ti ti-sword-off empty-icon"></i>
    <p>No weapons found</p>
    <small>Try a different search or tag</small>
  </div>

</div>

<!-- Lightbox -->
<div class="lb-overlay" id="lb-overlay" onclick="lbBgClick(event)">
  <div class="lb-inner">
    <div class="lb-img-wrap"><img id="lb-img" src="" alt=""></div>
  </div>
  <button class="lb-close" onclick="closeLb()"><i class="ti ti-x"></i></button>
  <button class="lb-nav lb-prev" onclick="lbStep(-1)"><i class="ti ti-chevron-left"></i></button>
  <button class="lb-nav lb-next" onclick="lbStep(1)"><i class="ti ti-chevron-right"></i></button>
  <div class="lb-caption">
    <div class="lb-cap-name" id="lb-cap-name"></div>
    <div class="lb-cap-type" id="lb-cap-type"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// WEAPONS DATA — add new weapons here
// image: path relative to this file, inside the cards/ folder
// tags: used for filtering — keep lowercase, no spaces (use hyphens)
// ─────────────────────────────────────────────
const WEAPONS = [
  {
    name: 'Repeating Crossbow',
    subtitle: 'Model Impact',
    type: 'Martial Ranged Weapon · Homebrew',
    tags: ['ranged','piercing','mechanical','two-handed'],
    image: 'cards/repeating-crossbow.png',
  },
  {
    name: 'Scroll Bow',
    subtitle: null,
    type: 'Martial Ranged Weapon · Arcane · Homebrew',
    tags: ['ranged','piercing','two-handed','arcane'],
    image: 'cards/scroll-bow.png',
  },
  {
    name: 'Adaption Blade',
    subtitle: '"The blade does not master one element — it masters all of them."',
    type: 'Martial Melee Weapon · Versatile · Homebrew',
    tags: ['melee','slashing','versatile','elemental'],
    image: 'cards/adaption-blade.png',
  },
  {
    name: 'Shock Axe',
    subtitle: 'Seiros Academy Prototype',
    type: 'Martial Melee Weapon · One-Handed · Homebrew',
    tags: ['melee','slashing','one-handed','lightning','seiros','prototype'],
    image: 'cards/shock-axe.png',
  },
  {
    name: 'Impact Fang',
    subtitle: 'Seiros Academy · Student Prototype',
    type: 'Ranged Sidearm · One-Handed · Homebrew',
    tags: ['ranged','one-handed','force','seiros','prototype'],
    image: 'cards/impact-fang.png',
  },
  {
    name: 'Charge Blade',
    subtitle: 'Seiros Academy · Student Prototype',
    type: 'Melee Weapon · Versatile · Katana · Homebrew',
    tags: ['melee','slashing','one-handed','versatile','chargeable','seiros','prototype'],
    image: 'cards/charge-blade.png',
  },
  {
    name: 'Tremor Warden',
    subtitle: 'Shockwave Pattern I',
    type: 'Arcane Staff · Versatile · Homebrew',
    tags: ['melee','bludgeoning','versatile','force','aoe','seiros','prototype'],
    image: 'cards/tremor-warden.png',
  },
  {
    name: 'Lumen',
    subtitle: 'Field Medic Pattern I',
    type: 'Martial Melee Weapon · Spear · Homebrew',
    tags: ['melee','piercing','reach','versatile','radiant','healing','seiros','prototype'],
    image: 'cards/lumen.png',
  },
];

// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
let activeTag = null;
let lbIndex   = 0;
let visible   = [];   // indices of currently shown weapons

// ─────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────
function boot() {
  buildTagFilters();
  renderGrid(WEAPONS.map((_,i)=>i));
}

// ─────────────────────────────────────────────
// Tag filters
// ─────────────────────────────────────────────
function buildTagFilters() {
  const all = new Set();
  WEAPONS.forEach(w => w.tags.forEach(t => all.add(t)));
  const order = ['melee','ranged','versatile','one-handed','two-handed','seiros','prototype','elemental','lightning','force','aoe','radiant','healing','arcane','mechanical','chargeable','piercing','slashing','bludgeoning','reach'];
  const sorted = [...order.filter(t=>all.has(t)), ...[...all].filter(t=>!order.includes(t)).sort()];

  const wrap = document.getElementById('tag-filters');
  const allBtn = document.createElement('button');
  allBtn.className = 'tag-btn active';
  allBtn.textContent = 'All';
  allBtn.dataset.tag = '';
  allBtn.onclick = () => setTag(null, allBtn);
  wrap.appendChild(allBtn);

  sorted.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tag-btn';
    btn.textContent = t;
    btn.dataset.tag = t;
    btn.onclick = () => setTag(t, btn);
    wrap.appendChild(btn);
  });
}

function setTag(tag, btn) {
  activeTag = tag;
  document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterCards();
}

// ─────────────────────────────────────────────
// Filter + render
// ─────────────────────────────────────────────
function filterCards() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const indices = WEAPONS.reduce((acc, w, i) => {
    const matchQ = !q || w.name.toLowerCase().includes(q) || (w.subtitle||'').toLowerCase().includes(q) || w.type.toLowerCase().includes(q) || w.tags.some(t=>t.includes(q));
    const matchT = !activeTag || w.tags.includes(activeTag);
    if (matchQ && matchT) acc.push(i);
    return acc;
  }, []);
  renderGrid(indices);
}

function renderGrid(indices) {
  visible = indices;
  const grid  = document.getElementById('card-grid');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');
  count.textContent = indices.length + ' weapon' + (indices.length !== 1 ? 's' : '');

  if (!indices.length) { grid.innerHTML=''; empty.classList.add('show'); return; }
  empty.classList.remove('show');

  grid.innerHTML = indices.map((wi, pos) => {
    const w = WEAPONS[wi];
    const specialTags = ['seiros','prototype','elemental','lightning','force','aoe','radiant','healing','arcane','chargeable'];
    const tagHtml = w.tags
      .filter(t => specialTags.includes(t))
      .map(t => `<span class="tag gold">${t}</span>`)
      .concat(w.tags.filter(t=>!specialTags.includes(t)).slice(0,3).map(t=>`<span class="tag">${t}</span>`))
      .join('');

    return `
      <div class="card-item" onclick="openLb(${pos})" title="${esc(w.name)}">
        <div class="card-img-wrap">
          <img src="${esc(w.image)}" alt="${esc(w.name)}"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
          <div class="card-placeholder" style="display:none">
            <i class="ti ti-sword ph-icon"></i>
            <div class="ph-name">${esc(w.name)}</div>
          </div>
        </div>
        <div class="card-info">
          <div class="card-name">${esc(w.name)}</div>
          ${w.subtitle ? `<div class="card-sub">${esc(w.subtitle)}</div>` : ''}
          <div class="card-tags">${tagHtml}</div>
        </div>
      </div>`;
  }).join('');
}

// ─────────────────────────────────────────────
// Lightbox
// ─────────────────────────────────────────────
function openLb(pos) {
  lbIndex = pos;
  showLb();
  document.getElementById('lb-overlay').classList.add('open');
}

function showLb() {
  const w = WEAPONS[visible[lbIndex]];
  const img = document.getElementById('lb-img');
  img.src = w.image;
  img.alt = w.name;
  document.getElementById('lb-cap-name').textContent = w.name;
  document.getElementById('lb-cap-type').textContent = w.type;
  // scroll to top of image wrap
  document.querySelector('.lb-img-wrap').scrollTop = 0;
}

function closeLb() {
  document.getElementById('lb-overlay').classList.remove('open');
}

function lbStep(dir) {
  lbIndex = (lbIndex + dir + visible.length) % visible.length;
  showLb();
}

function lbBgClick(e) {
  if (e.target === document.getElementById('lb-overlay') || e.target.closest('.lb-inner')?.tagName !== 'DIV') return;
  if (!e.target.closest('.lb-img-wrap')) closeLb();
}

// ─────────────────────────────────────────────
// Keyboard
// ─────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const lb = document.getElementById('lb-overlay');
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape')     closeLb();
  if (e.key === 'ArrowRight') lbStep(1);
  if (e.key === 'ArrowLeft')  lbStep(-1);
});

// ─────────────────────────────────────────────
// Util
// ─────────────────────────────────────────────
function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg) { const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600); }

boot();
</script>
</body>
</html>
