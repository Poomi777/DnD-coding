<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homebrew Arsenal — Seiros Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
/* ═══════════════════════════════════════════
   GALLERY PAGE
═══════════════════════════════════════════ */
:root {
  --bg:#0d1117;--bg-s:#161b24;--bg-e:#1c2333;
  --bdr:#2a3244;--bdr-d:#1c2333;
  --txt:#e2e8f0;--muted:#64748b;--dim:#3a4558;
  --gold:#c9a84c;--gold-bg:rgba(201,168,76,.12);--gold-bdr:rgba(201,168,76,.3);
  --r:8px;--rl:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(201,168,76,.04) 0%,transparent 70%);pointer-events:none;z-index:0;}

.page{position:relative;max-width:1200px;margin:0 auto;padding:32px 20px 80px;z-index:1;}

.site-header{text-align:center;margin-bottom:36px;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.site-header h1{font-family:'Cinzel',serif;font-size:30px;font-weight:700;color:var(--txt);}
.site-header .sub{font-size:14px;color:var(--muted);margin-top:6px;}
.hline{width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px auto 0;}

.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
.sw{flex:1;min-width:160px;position:relative;}
.sw .ti{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}
.si{width:100%;background:var(--bg-s);border:1px solid var(--bdr);border-radius:var(--r);padding:8px 10px 8px 30px;font-size:13px;color:var(--txt);font-family:inherit;transition:border-color .15s;}
.si:focus{outline:none;border-color:var(--gold);}
.si::placeholder{color:var(--dim);}
.cnt{font-size:13px;color:var(--muted);white-space:nowrap;}

.tf{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px;}
.tb{font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;border:1px solid var(--bdr);background:var(--bg-s);color:var(--muted);cursor:pointer;transition:all .12s;font-family:inherit;text-transform:uppercase;letter-spacing:.5px;}
.tb:hover{border-color:var(--gold-bdr);color:var(--gold);}
.tb.on{background:var(--gold-bg);border-color:var(--gold-bdr);color:var(--gold);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}

/* thumb card */
.thumb{cursor:pointer;border-radius:var(--rl);overflow:hidden;border:1px solid var(--bdr);background:var(--bg-s);transition:transform .18s,border-color .18s,box-shadow .18s;display:flex;flex-direction:column;}
.thumb:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(0,0,0,.4);}
.thumb-band{height:6px;flex-shrink:0;}
.thumb-body{padding:14px 14px 12px;flex:1;display:flex;flex-direction:column;}
.thumb-type{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.thumb-name{font-family:'Cinzel',serif;font-size:15px;font-weight:700;color:var(--txt);line-height:1.25;margin-bottom:4px;}
.thumb-sub{font-size:11px;color:var(--muted);font-style:italic;margin-bottom:10px;}
.thumb-dmg{font-size:13px;font-weight:700;margin-bottom:10px;}
.thumb-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto;}
.tg{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;border:1px solid;text-transform:uppercase;letter-spacing:.4px;}
.tg-plain{background:var(--bg-e);border-color:var(--bdr);color:var(--muted);}

.empty{text-align:center;padding:80px 20px;color:var(--muted);display:none;}
.empty.show{display:block;}
.empty .ei{font-size:48px;opacity:.12;display:block;margin-bottom:14px;}

/* ── Lightbox ── */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:900;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;opacity:0;pointer-events:none;transition:opacity .2s;overflow-y:auto;}
.lb.open{opacity:1;pointer-events:auto;}
.lb-inner{position:relative;width:100%;max-width:460px;margin:auto;}
.lb-close{position:fixed;top:16px;right:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;z-index:910;}
.lb-close:hover{background:rgba(255,255,255,.2);}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;width:44px;height:64px;border-radius:var(--r);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;z-index:910;}
.lb-nav:hover{background:rgba(255,255,255,.2);}
.lb-prev{left:12px;}
.lb-next{right:12px;}

/* ═══════════════════════════════════════════
   WEAPON CARD
═══════════════════════════════════════════ */
.wc{
  font-family:'Crimson Pro',Georgia,serif;
  background:#0a0c0a;
  border-radius:12px;
  padding:28px 26px 20px;
  position:relative;
  color:#d4cfc0;
  width:100%;
  border:1px solid;
}

/* corners */
.wc-corners{position:absolute;inset:6px;pointer-events:none;}
.wc-corner{position:absolute;width:16px;height:16px;border-color:inherit;}
.wc-corner.tl{top:0;left:0;border-top:2px solid;border-left:2px solid;}
.wc-corner.tr{top:0;right:0;border-top:2px solid;border-right:2px solid;}
.wc-corner.bl{bottom:0;left:0;border-bottom:2px solid;border-left:2px solid;}
.wc-corner.br{bottom:0;right:0;border-bottom:2px solid;border-right:2px solid;}

/* header */
.wc-type{font-family:'Cinzel',serif;font-size:9px;font-weight:400;letter-spacing:2.5px;text-transform:uppercase;text-align:center;color:inherit;opacity:.7;margin-bottom:10px;line-height:1.6;}
.wc-name{font-family:'Cinzel',serif;font-size:26px;font-weight:700;text-align:center;color:inherit;line-height:1.2;margin-bottom:6px;}
.wc-subtitle{font-family:'Cinzel',serif;font-size:13px;text-align:center;color:inherit;opacity:.75;margin-bottom:10px;}
.wc-badge{display:inline-flex;align-items:center;gap:6px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:5px 14px;border-radius:20px;border:1px solid;margin:0 auto 10px;display:table;text-align:center;}
.wc-flavor{font-size:13px;font-style:italic;text-align:center;opacity:.6;margin-bottom:4px;line-height:1.5;padding:0 8px;}
.wc-divider{border:none;border-top:1px solid;opacity:.2;margin:14px 0;}

/* stats */
.wc-stat{display:flex;align-items:center;border:1px solid;border-radius:6px;margin-bottom:8px;overflow:hidden;}
.wc-stat-lbl{font-family:'Cinzel',serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:10px 14px;opacity:.6;min-width:100px;flex-shrink:0;border-right:1px solid;opacity:.5;}
.wc-stat-val{padding:10px 16px;font-size:17px;font-weight:700;flex:1;text-align:right;line-height:1.3;}
.wc-stat-sub{font-size:11px;font-weight:400;opacity:.6;display:block;margin-top:2px;}

.wc-range-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.wc-range-box{border:1px solid;border-radius:6px;padding:10px 14px;opacity:.85;}
.wc-range-lbl{font-family:'Cinzel',serif;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;opacity:.6;margin-bottom:4px;}
.wc-range-val{font-size:17px;font-weight:700;}
.wc-range-note{font-size:11px;opacity:.5;margin-top:2px;}

/* tags */
.wc-tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 8px;}
.wc-tag{font-family:'Cinzel',serif;font-size:10px;letter-spacing:1px;padding:4px 10px;border-radius:4px;border:1px solid;text-transform:uppercase;}

/* prop divider */
.wc-pdiv{display:flex;align-items:center;gap:0;margin:14px 0 12px;}
.wc-pdiv::before,.wc-pdiv::after{content:'';flex:1;height:1px;background:currentColor;opacity:.2;}
.wc-pdiv-icon{font-size:10px;padding:0 10px;opacity:.5;}

/* special props section */
.wc-props-title{font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;opacity:.5;margin-bottom:12px;}
.wc-prop{background:rgba(255,255,255,.04);border:1px solid;border-radius:6px;padding:14px;margin-bottom:10px;}
.wc-prop-title{font-family:'Cinzel',serif;font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:7px;}
.wc-prop-icon{font-size:11px;}
.wc-prop-body{font-size:14px;line-height:1.65;}
.wc-prop-body strong{font-weight:700;}
.wc-prop-body p{margin-bottom:8px;}
.wc-prop-body p:last-child{margin-bottom:0;}

/* stat mini-boxes */
.wc-sboxes{display:grid;gap:8px;margin-top:12px;}
.wc-sbox{background:rgba(0,0,0,.25);border:1px solid;border-radius:6px;padding:10px 12px;text-align:center;}
.wc-sbox-lbl{font-family:'Cinzel',serif;font-size:8px;letter-spacing:1.2px;text-transform:uppercase;opacity:.55;margin-bottom:4px;line-height:1.4;}
.wc-sbox-val{font-size:17px;font-weight:700;}
.wc-sbox-note{font-size:10px;opacity:.55;margin-top:2px;}

/* use counters */
.wc-uses{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid;border-color:inherit;opacity:.7;}
.wc-use-pips{display:flex;gap:5px;}
.wc-use-pip{width:28px;height:28px;border-radius:6px;border:1px solid;display:flex;align-items:center;justify-content:center;font-size:13px;}
.wc-use-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;opacity:.7;}

/* table */
.wc-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;}
.wc-table th{font-family:'Cinzel',serif;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:6px 8px;text-align:center;border-bottom:1px solid;opacity:.6;}
.wc-table td{padding:7px 8px;text-align:center;border-bottom:1px solid;font-size:13px;}
.wc-table tr:last-child td{border-bottom:none;}
.wc-table td.hl{font-weight:700;}

/* warning box */
.wc-warn{border:1px solid;border-radius:6px;padding:12px 14px;margin-bottom:10px;}
.wc-warn-title{font-family:'Cinzel',serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.wc-warn-body{font-size:13px;line-height:1.6;}

/* element grid */
.elem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;}
.elem-btn{border-radius:5px;border:1px solid;padding:8px 4px;text-align:center;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.8px;text-transform:uppercase;font-weight:600;}
.elem-icon{font-size:14px;display:block;margin-bottom:3px;}

/* magazine */
.wc-mag-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;opacity:.6;margin-bottom:6px;}
.wc-mag-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px;}
.wc-mag-pip{width:26px;height:26px;border-radius:4px;border:1px solid;display:flex;align-items:center;justify-content:center;font-size:11px;}
.wc-mag-info{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.8px;opacity:.7;margin-bottom:8px;}

/* attack table */
.wc-atk-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.wc-atk-box{border:1px solid;border-radius:6px;padding:10px;text-align:center;}
.wc-atk-lbl{font-family:'Cinzel',serif;font-size:9px;letter-spacing:1px;text-transform:uppercase;opacity:.6;margin-bottom:4px;}
.wc-atk-val{font-size:20px;font-weight:700;}
.wc-atk-sub{font-size:10px;opacity:.55;margin-top:2px;}

/* diagram */
.wc-diagram{display:flex;flex-direction:column;align-items:center;padding:16px 0 8px;gap:6px;opacity:.75;}
.diag-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;opacity:.6;}
.diag-circle{width:80px;height:80px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;position:relative;}
.diag-center{width:12px;height:12px;border-radius:50%;background:currentColor;}
.diag-arrows{display:flex;align-items:center;gap:8px;font-size:12px;}

.beam-diag{display:flex;flex-direction:column;align-items:center;padding:8px 0;}
.beam-shape{width:0;height:0;border-left:30px solid transparent;border-right:30px solid transparent;border-bottom:70px solid;opacity:.4;margin-bottom:4px;}
.beam-zone{font-family:'Cinzel',serif;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 12px;border:1px solid;border-radius:10px;opacity:.7;}

/* footer */
.wc-footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid;border-color:inherit;}
.wc-footer span{font-family:'Cinzel',serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;opacity:.4;}

/* toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1c2333;border:1px solid #2a3244;border-radius:20px;padding:8px 18px;font-size:13px;color:#e2e8f0;z-index:999;pointer-events:none;animation:ti .2s ease,to .3s ease 2s forwards;}
@keyframes ti{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
@keyframes to{to{opacity:0;transform:translateX(-50%) translateY(8px);}}

@media(max-width:600px){
  .site-header h1{font-size:24px;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;}
  .lb-nav{display:none;}
  .page{padding:20px 12px 60px;}
  .lb{padding:12px 8px;}
  .lb-inner{max-width:100%;}
  .lb-close{top:8px;right:8px;}
  .wc{padding:20px 16px 16px;}
  .wc-name{font-size:20px;}
  .wc-stat-lbl{min-width:72px;font-size:9px;padding:8px 10px;}
  .wc-stat-val{padding:8px 10px;font-size:15px;}
  .elem-grid{grid-template-columns:repeat(2,1fr);}
  .wc-atk-row{grid-template-columns:1fr;}
  .wc-range-row{grid-template-columns:1fr;}
}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2a3244;border-radius:10px;}

/* ── Site nav ── */
.snav{display:flex;align-items:center;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
.snav-brand{font-family:'Cinzel',serif;font-size:13px;font-weight:700;color:var(--txt);display:flex;align-items:center;gap:7px;}
.snav-icon{width:30px;height:30px;background:linear-gradient(135deg,#7f1d1d,#1e1b4b);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;}
.snav-sep{color:var(--bdr);margin:0 2px;}
.snav-links{display:flex;gap:5px;flex-wrap:wrap;}
.snav-link{font-size:11px;color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:20px;border:1px solid var(--bdr);background:var(--bg-s);transition:all .15s;display:inline-flex;align-items:center;gap:4px;}
.snav-link:hover{color:var(--txt);border-color:rgba(255,255,255,.12);}
.snav-link.on{color:var(--gold);border-color:var(--gold-bdr);background:var(--gold-bg);}
  </style>
</head>
<body>
<div class="page">
  <nav class="snav">
    <div class="snav-brand"><div class="snav-icon">🎲</div> D&amp;D Tools</div>
    <span class="snav-sep">|</span>
    <div class="snav-links">
      <a href="../initiative-tracker/index.html" class="snav-link"><i class="ti ti-swords"></i> Initiative Tracker</a>
      <a href="./index.html" class="snav-link on"><i class="ti ti-bow-arrow"></i> Weapons Arsenal</a>
      <a href="../players/index.html" class="snav-link"><i class="ti ti-users"></i> Players</a>
    </div>
  </nav>
  <header class="site-header">
    <div class="eyebrow">DM Homebrew</div>
    <h1>⚔ Homebrew Arsenal</h1>
    <div class="sub">Seiros Academy &amp; Custom Weapons</div>
    <div class="hline"></div>
  </header>

  <div class="controls">
    <div class="sw">
      <i class="ti ti-search"></i>
      <input class="si" id="search" type="search" placeholder="Search weapons…" oninput="filter()">
    </div>
    <span class="cnt" id="cnt"></span>
  </div>

  <div class="tf" id="tf"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">
    <i class="ti ti-sword-off ei"></i>
    <p>No weapons found</p>
    <small>Try a different search or filter</small>
  </div>
</div>

<!-- Lightbox -->
<div class="lb" id="lb" onclick="lbBg(event)">
  <div class="lb-inner" id="lb-inner"></div>
  <button class="lb-close" onclick="closeLb()"><i class="ti ti-x"></i></button>
  <button class="lb-nav lb-prev" onclick="lbStep(-1)"><i class="ti ti-chevron-left"></i></button>
  <button class="lb-nav lb-next" onclick="lbStep(1)"><i class="ti ti-chevron-right"></i></button>
</div>

<script>
// ═══════════════════════════════════════════════════
//  WEAPON DATA
// ═══════════════════════════════════════════════════
const W = [
{
  id:'repeating-crossbow', name:'Repeating Crossbow', sub:'Model Impact',
  type:'Martial Ranged Weapon · Homebrew',
  accent:'#c9a84c', glow:null, acR:'201,168,76',
  dmgPreview:'3d6 + ability mod',
  filterTags:['ranged','piercing','mechanical','two-handed'],
  previewTags:['Ranged','Mechanical'],
},
{
  id:'scroll-bow', name:'Scroll Bow', sub:null,
  type:'Martial Ranged Weapon · Arcane · Homebrew',
  accent:'#5577aa', glow:null, acR:'85,119,170',
  dmgPreview:'1d8 + ability mod',
  filterTags:['ranged','piercing','two-handed','arcane'],
  previewTags:['Ranged','Arcane'],
},
{
  id:'adaption-blade', name:'Adaption Blade', sub:null,
  type:'Martial Melee Weapon · Versatile · Homebrew',
  accent:'#4a8f2a', glow:null, acR:'74,143,42',
  dmgPreview:'1d8 + ability mod',
  filterTags:['melee','slashing','versatile','elemental'],
  previewTags:['Melee','Elemental'],
},
{
  id:'shock-axe', name:'Shock Axe', sub:'Seiros Academy Prototype',
  type:'Martial Melee Weapon · One-Handed · Homebrew',
  accent:'#7c4de8', glow:'rgba(100,60,220,.7)', acR:'124,77,232',
  dmgPreview:'2d6 + ability mod',
  filterTags:['melee','slashing','one-handed','lightning','seiros','prototype'],
  previewTags:['Melee','Lightning','Seiros'],
},
{
  id:'impact-fang', name:'Impact Fang', sub:'Seiros Academy · Student Prototype',
  type:'Ranged Sidearm · One-Handed · Homebrew',
  accent:'#00b4d8', glow:'rgba(0,180,216,.7)', acR:'0,180,216',
  dmgPreview:'1d8 + ability mod',
  filterTags:['ranged','one-handed','force','seiros','prototype'],
  previewTags:['Ranged','Force','Seiros'],
},
{
  id:'charge-blade', name:'Charge Blade', sub:'Seiros Academy · Student Prototype',
  type:'Melee Weapon · Versatile · Katana · Homebrew',
  accent:'#cc2222', glow:'rgba(200,30,30,.75)', acR:'204,34,34',
  dmgPreview:'1d8 + ability mod',
  filterTags:['melee','slashing','versatile','chargeable','seiros','prototype'],
  previewTags:['Melee','Chargeable','Seiros'],
},
{
  id:'tremor-warden', name:'Tremor Warden', sub:'Shockwave Pattern I',
  type:'Arcane Staff · Versatile · Homebrew',
  accent:'#00b894', glow:'rgba(0,184,148,.7)', acR:'0,184,148',
  dmgPreview:'1d8 / 1d10 two-handed',
  filterTags:['melee','bludgeoning','versatile','force','aoe','seiros','prototype'],
  previewTags:['Melee','Force','AOE','Seiros'],
},
{
  id:'lumen', name:'Lumen', sub:'Field Medic Pattern I',
  type:'Martial Melee Weapon · Spear · Homebrew',
  accent:'#e8c020', glow:'rgba(232,192,32,.7)', acR:'232,192,32',
  dmgPreview:'2d10 + ability mod',
  filterTags:['melee','piercing','reach','versatile','radiant','healing','seiros','prototype'],
  previewTags:['Melee','Radiant','Healing','Seiros'],
},
];

// ═══════════════════════════════════════════════════
//  CARD HTML BUILDERS  (one per weapon)
// ═══════════════════════════════════════════════════
function buildCard(w) {
  switch(w.id) {
    case 'repeating-crossbow': return cardRepeatingCrossbow(w);
    case 'scroll-bow':         return cardScrollBow(w);
    case 'adaption-blade':     return cardAdaptionBlade(w);
    case 'shock-axe':          return cardShockAxe(w);
    case 'impact-fang':        return cardImpactFang(w);
    case 'charge-blade':       return cardChargeBlade(w);

function cc(w,inner) {
  const glow = w.glow ? `box-shadow:0 0 0 1px ${w.accent},0 0 30px ${w.glow},0 0 60px ${w.glow}40;` : '';
  return `<div class="wc" style="border-color:${w.accent}40;${glow}color:${w.accent}">
  <div class="wc-corners" style="border-color:${w.accent}">
    <div class="wc-corner tl"></div><div class="wc-corner tr"></div>
    <div class="wc-corner bl"></div><div class="wc-corner br"></div>
  </div>
  ${inner}
  </div>`;
}

function wcStat(lbl, val, sub, ac) {
  return `<div class="wc-stat" style="border-color:${ac}25;color:${ac}">
    <div class="wc-stat-lbl" style="border-color:${ac}25">${lbl}</div>
    <div class="wc-stat-val" style="color:${ac}">${val}${sub?`<span class="wc-stat-sub" style="color:${ac}99">${sub}</span>`:''}</div>
  </div>`;
}

function wcRange(boxes, ac) {
  return `<div class="wc-range-row">${boxes.map(b=>`
    <div class="wc-range-box" style="border-color:${ac}25;background:${ac}08">
      <div class="wc-range-lbl">${b.label}</div>
      <div class="wc-range-val" style="color:${ac}">${b.value}</div>
      ${b.note?`<div class="wc-range-note">${b.note}</div>`:''}
    </div>`).join('')}</div>`;
}

function wcTags(tags, ac) {
  return `<div class="wc-tags">${tags.map(t=>`
    <span class="wc-tag" style="border-color:${t.sp?ac+'80':ac+'28'};color:${t.sp?ac:ac+'99'};background:${t.sp?ac+'18':'transparent'}">${t.text}</span>
  `).join('')}</div>`;
}

function wcPdiv(icon, ac) {
  return `<div class="wc-pdiv" style="color:${ac}"><span class="wc-pdiv-icon">${icon}</span></div>`;
}

function wcPropOpen(icon, title, ac) {
  return `<div class="wc-prop" style="border-color:${ac}22;background:${ac}06">
    <div class="wc-prop-title" style="color:${ac}"><span class="wc-prop-icon">${icon}</span> ${title}</div>
    <div class="wc-prop-body" style="color:#c8c0b0">`;
}

function wcSboxes(boxes, cols, ac) {
  return `<div class="wc-sboxes" style="grid-template-columns:repeat(${cols},1fr)">${boxes.map(b=>`
    <div class="wc-sbox" style="border-color:${ac}25">
      <div class="wc-sbox-lbl">${b.label}</div>
      <div class="wc-sbox-val" style="color:${ac}">${b.value}</div>
      ${b.note?`<div class="wc-sbox-note">${b.note}</div>`:''}
    </div>`).join('')}</div>`;
}

function wcUses(count, pip, label, ac) {
  const pips = Array(count).fill(`<div class="wc-use-pip" style="border-color:${ac}50;color:${ac}">${pip}</div>`).join('');
  return `<div class="wc-uses" style="border-color:${ac}30">
    <div class="wc-use-pips">${pips}</div>
    <div class="wc-use-label">${label}</div>
  </div>`;
}

function wcFooter(left, right, ac) {
  return `<div class="wc-footer" style="border-color:${ac}20">
    <span>${left}</span><span>${right}</span>
  </div>`;
}

    <hr class="wc-divider" style="border-color:${ac}30">
    ${wcStat('TO HIT','1d20 + ability mod + proficiency','',ac)}
    ${wcStat('BASE DAMAGE','2d10','2d12 two-handed + mod',ac)}
    ${wcRange([
      {label:'REACH',value:'10 ft',note:'Melee Piercing'},
      {label:'BEAM ZONE',value:'5 ft',note:'Radius at target point'},
    ],ac)}
    ${wcTags([
      {text:'MELEE'},{text:'PIERCING'},{text:'REACH'},{text:'VERSATILE'},
      {text:'✦ RADIANT',sp:true},{text:'✦ HEALING',sp:true},{text:'✦ SEIROS',sp:true},{text:'◎ PROTOTYPE',sp:true}
    ],ac)}
    ${wcPdiv('✦',ac)}
    <div class="wc-props-title">Special Properties</div>
    ${wcPropOpen('✦','Lumen Beam',ac)}
      <p>Call down a <strong>beam of restorative light</strong> at a point within <strong style="color:${ac}">30 ft</strong>. The beam covers a <strong>5 ft zone</strong> at that location. All creatures standing within the beam are <strong style="color:${ac}">healed for 2d6 HP.</strong></p>
      ${wcSboxes([
        {label:'HEALING',value:'2d6 HP',note:''},
        {label:'CAST\nRANGE',value:'30 ft',note:''},
        {label:'ZONE\nSIZE',value:'5 ft',note:''},
        {label:'CHARGES',value:'2 / rest',note:''},
      ],4,ac)}
      <div style="margin-top:14px">
        <div class="wc-range-lbl" style="margin-bottom:8px;text-align:center">BEAM DIAGRAM</div>
        <div class="beam-diag">
          <div class="beam-shape" style="border-bottom-color:${ac}"></div>
          <div class="beam-zone" style="border-color:${ac}50;color:${ac}90">5 FT ZONE</div>
        </div>
        <div style="font-family:'Cinzel',serif;font-size:9px;letter-spacing:.8px;text-align:center;opacity:.45;margin-top:6px">All creatures in the light are healed · Range 30 ft</div>
      </div>
      ${wcUses(2,'✦','2 CHARGES · RECHARGE ON LONG REST',ac)}
    </div></div>

  `);
}

// ═══════════════════════════════════════════════════
//  GALLERY
// ═══════════════════════════════════════════════════
let activeTag = null, lbIdx = 0, visible = [];

function boot() {
  buildFilters();
  showAll();
}

function buildFilters() {
  const all = new Set();
  W.forEach(w => w.filterTags.forEach(t => all.add(t)));
  const order = ['melee','ranged','versatile','one-handed','two-handed','seiros','prototype','elemental','lightning','force','aoe','radiant','healing','arcane','chargeable','mechanical','piercing','slashing','bludgeoning','reach'];
  const sorted = [...order.filter(t=>all.has(t)),...[...all].filter(t=>!order.includes(t)).sort()];

  const wrap = document.getElementById('tf');
  const allBtn = mkBtn('All','',true);
  allBtn.onclick = () => { activeTag=null; document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on')); allBtn.classList.add('on'); filter(); };
  wrap.appendChild(allBtn);
  sorted.forEach(t => {
    const b = mkBtn(t,t,false);
    b.onclick = () => { activeTag=t; document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on')); b.classList.add('on'); filter(); };
    wrap.appendChild(b);
  });
}

function mkBtn(text, tag, on) {
  const b = document.createElement('button');
  b.className = 'tb' + (on?' on':'');
  b.textContent = text;
  b.dataset.tag = tag;
  return b;
}

function showAll() { filter(); }

function filter() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  visible = W.reduce((acc,w,i) => {
    const mq = !q || w.name.toLowerCase().includes(q) || (w.sub||'').toLowerCase().includes(q) || w.type.toLowerCase().includes(q) || w.filterTags.some(t=>t.includes(q));
    const mt = !activeTag || w.filterTags.includes(activeTag);
    if (mq && mt) acc.push(i);
    return acc;
  }, []);
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  document.getElementById('cnt').textContent = visible.length + ' weapon' + (visible.length!==1?'s':'');
  if (!visible.length) { grid.innerHTML=''; empty.classList.add('show'); return; }
  empty.classList.remove('show');

  grid.innerHTML = visible.map((wi,pos) => {
    const w = W[wi];
    const tags = w.previewTags.slice(0,3).map(t=>`<span class="tg tg-plain">${t}</span>`).join('');
    const borderStyle = w.glow
      ? `border-color:${w.accent}60;box-shadow:0 0 14px ${w.glow.replace('.7','.25')}`
      : `border-color:${w.accent}40`;
    return `<div class="thumb" style="${borderStyle}" onclick="openLb(${pos})">
      <div class="thumb-band" style="background:${w.accent}"></div>
      <div class="thumb-body">
        <div class="thumb-type">${w.type.split('·')[0].trim()}</div>
        <div class="thumb-name" style="color:${w.accent}">${w.name}</div>
        ${w.sub?`<div class="thumb-sub">${w.sub}</div>`:''}
        <div class="thumb-dmg" style="color:${w.accent}">${w.dmgPreview}</div>
        <div class="thumb-tags">${tags}</div>
      </div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════
//  LIGHTBOX
// ═══════════════════════════════════════════════════
function openLb(pos) { lbIdx=pos; renderLb(); document.getElementById('lb').classList.add('open'); document.getElementById('lb').scrollTop=0; }
function closeLb() { document.getElementById('lb').classList.remove('open'); }

function renderLb() {
  const w = W[visible[lbIdx]];
  document.getElementById('lb-inner').innerHTML = buildCard(w);
}

function lbStep(dir) {
  lbIdx = (lbIdx + dir + visible.length) % visible.length;
  renderLb();
  document.getElementById('lb').scrollTop = 0;
}

function lbBg(e) { if (e.target === document.getElementById('lb')) closeLb(); }

document.addEventListener('keydown', e => {
  const lb = document.getElementById('lb');
  if (!lb.classList.contains('open')) return;
  if (e.key==='Escape') closeLb();
  if (e.key==='ArrowRight') lbStep(1);
  if (e.key==='ArrowLeft') lbStep(-1);
});

boot();
</script>
